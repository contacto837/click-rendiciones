async function comprimir(file){
  if(!file||!file.type.startsWith('image/')||file.type==='image/gif')return file;
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);

    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));

/* ====== backend Supabase ====== */
function SupaAPI(){
  const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  const correo=async u=>{const n=normU(u);if(/^[a-z0-9._-]+$/.test(n))return `${n}@${CONFIG.DOMINIO}`;const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n)))).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40);return `u-${h}@${CONFIG.DOMINIO}`};
  const chk=({data,error})=>{if(error)throw error;return data};
  let uid=null;
  const perfil=async id=>chk(await sb.from('profiles').select('*').eq('id',id).single());
  const campos=d=>({p_nombre:d.nombre||'',p_rol:d.rol||'tecnico',p_rut:d.rut||null,p_telefono:d.telefono||null,p_banco:d.banco||null,p_tipo_cuenta:d.tipo_cuenta||null,p_numero_cuenta:d.numero_cuenta||null,p_email_pago:d.email_pago||null});
  return {
    async sesion(){const {data}=await sb.auth.getSession();const u=data.session?.user;if(!u)return null;uid=u.id;const p=await perfil(u.id).catch(()=>null);if(!p||!p.activo){await sb.auth.signOut();return null}return p},

    async categorias(){return chk(await sb.from('categorias').select('*').order('orden'))},
    async guardarCategoria(cod,c){const d=chk(await sb.from('categorias').update(c).eq('codigo',cod).select());if(!d.length)throw new Error('NO_AUTORIZADO')},
    async boletas(){return chk(await sb.from('boletas').select('*').order('fecha',{ascending:false}).order('id',{ascending:false}).limit(10000))},
    async crearBoleta(d,file){const f=await comprimir(file);const path=`${uid}/${Date.now()}.${extDe(f)}`;

    async eliminarBoleta(b){const d=chk(await sb.from('boletas').delete().eq('id',b.id).select());if(!d.length)throw new Error('NO_AUTORIZADO');await sb.storage.from('boletas').remove([b.foto_path])},

    async pagos(){return chk(await sb.from('pagos').select('*').order('fecha_pago',{ascending:false}).order('id',{ascending:false}))},
    async registrarPago(tec,ids,fecha,nota,file){const f=await comprimir(file);const path=`${tec}/${Date.now()}.${extDe(f)}`;
      chk(await sb.storage.from('comprobantes').upload(path,f,{contentType:f.type||'application/octet-stream'}));

      if(r.error){await sb.storage.from('comprobantes').remove([path]);throw r.error}return r.data},

      if(r.error)throw r.error;const u=r.data.user;if(!u||(u.identities&&u.identities.length===0))throw new Error('USUARIO_EXISTE');

    async cambiarMiClave(c){chk(await sb.auth.updateUser({password:c}))},
    async misDatos(d){chk(await sb.rpc('actualizar_mis_datos',{p_rut:d.rut,p_telefono:d.telefono,p_banco:d.banco,p_tipo_cuenta:d.tipo_cuenta,p_numero_cuenta:d.numero_cuenta,p_email_pago:d.email_pago}))},

    async eliminarHabilitacion(id){const d=chk(await sb.from('habilitaciones').delete().eq('id',id).eq('usada',false).select());if(!d.length)throw new Error('HAB_USADA')}

/* ====== backend de demostración (localStorage) ====== */
function semilla(){
  return {seq:0,
    users:[{id:'u1',usuario:'admin',clave:'admin123',nombre:'Administrador',rol:'admin',activo:true}],
    cats:[{codigo:'desayuno',nombre:'Desayuno',tope:5000,orden:1,activo:true},{codigo:'almuerzo',nombre:'Almuerzo',tope:8000,orden:2,activo:true},{codigo:'cena',nombre:'Cena',tope:8000,orden:3,activo:true},{codigo:'hidratacion',nombre:'Hidratación',tope:2000,orden:4,activo:true}],
    pagos:[],boletas:[],habs:[]};
}
function DemoAPI(){
  const K='click_rendiciones_demo_v2';
  let db=null;try{db=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
  if(!db||!db.users)db=semilla();
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Modo demo: este navegador no permitió guardar.','err')}};
  save();
  let uid=null;try{uid=sessionStorage.getItem(K+'_s')}catch(e){}
  const setS=v=>{uid=v;try{v?sessionStorage.setItem(K+'_s',v):sessionStorage.removeItem(K+'_s')}catch(e){}};
  const yo=()=>db.users.find(u=>u.id===uid);
  const adm=()=>{const u=yo();return !!u&&u.rol==='admin'&&u.activo};
  const pub=u=>{const r={...u};delete r.clave;return r};
  const req=c=>{if(!c)throw new Error('NO_AUTORIZADO')};
  const cp=o=>JSON.parse(JSON.stringify(o));
  const BANCO=['rut','telefono','banco','tipo_cuenta','numero_cuenta','email_pago'];
  const archivo=async file=>{const f=await comprimir(file);if(f.size>2.5e6)throw new Error('En modo demo el archivo debe pesar menos de 2,5 MB.');return aDataURL(f)};
  return {
    async sesion(){const u=yo();return u&&u.activo?pub(u):null},
    async login(us,c){const u=db.users.find(x=>x.usuario===normU(us)&&x.clave===c);if(!u)throw new Error('CREDENCIALES');if(!u.activo)throw new Error('USUARIO_INACTIVO');setS(u.id);return pub(u)},
    async logout(){setS(null)},
    async categorias(){return cp(db.cats).sort((a,b)=>a.orden-b.orden)},
    async guardarCategoria(cod,c){req(adm());Object.assign(db.cats.find(x=>x.codigo===cod),c);save()},
    async boletas(){return cp(db.boletas.filter(b=>adm()||b.tecnico_id===uid)).sort(ordFecha('fecha'))},
    async crearBoleta(d,file){const u=yo();if(!u||!u.activo)throw new Error('USUARIO_INACTIVO');
      const cat=db.cats.find(c=>c.codigo===d.categoria&&c.activo);if(!cat)throw new Error('CATEGORIA_INVALIDA');
      if(d.fecha>hoy())throw new Error('FECHA_FUTURA');
      const b={...d,tecnico_id:u.id,tope_aplicado:cat.tope,monto_aprobado:Math.min(d.monto_boleta,cat.tope),estado:'pendiente',extra:false,pago_id:null,habilitacion_id:null,motivo_admin:null,created_at:new Date().toISOString()};
      let h=null;
      if(db.boletas.some(x=>x.tecnico_id===u.id&&x.fecha===d.fecha&&x.categoria===d.categoria&&x.estado!=='rechazada')){
        h=db.habs.filter(x=>x.tecnico_id===u.id&&x.fecha===d.fecha&&!x.usada&&(!x.categoria||x.categoria===d.categoria)).sort((a,c)=>(a.categoria?0:1)-(c.categoria?0:1))[0];
        if(!h)throw new Error('YA_EXISTE');b.extra=true;b.habilitacion_id=h.id}
      b.foto_path=await archivo(file);b.id=++db.seq;if(h)h.usada=true;db.boletas.push(b);save();return cp(b)},
    async eliminarBoleta(b){const x=db.boletas.find(y=>y.id===b.id);req(x&&((x.tecnico_id===uid&&x.estado==='pendiente')||(adm()&&x.estado!=='pagada')));
      if(x.habilitacion_id){const h=db.habs.find(y=>y.id===x.habilitacion_id);if(h)h.usada=false}db.boletas=db.boletas.filter(y=>y.id!==b.id);save()},
    async ajustarBoleta(id,c){req(adm());const x=db.boletas.find(y=>y.id===id);req(x&&x.estado!=='pagada');Object.assign(x,c);save()},
    async pagos(){return cp(db.pagos.filter(p=>adm()||p.tecnico_id===uid)).sort(ordFecha('fecha_pago'))},
    async registrarPago(tec,ids,fecha,nota,file){req(adm());const bs=db.boletas.filter(b=>ids.includes(b.id)&&b.tecnico_id===tec&&b.estado==='pendiente');
      if(!bs.length||bs.length!==ids.length)throw new Error('BOLETAS_INVALIDAS');const monto=sumar(bs,b=>b.monto_aprobado);if(monto<=0)throw new Error('MONTO_CERO');
      const p={tecnico_id:tec,monto,fecha_pago:fecha,comprobante_path:await archivo(file),nota:nota||null,creado_por:uid,created_at:new Date().toISOString()};
      p.id=++db.seq;db.pagos.push(p);bs.forEach(b=>{b.estado='pagada';b.pago_id=p.id});save();return p.id},
    async url(bucket,path){return path},
    async usuarios(){req(adm());return db.users.map(pub).sort((a,b)=>a.nombre.localeCompare(b.nombre))},
    async crearUsuario(d){req(adm());if(db.users.some(u=>u.usuario===d.usuario))throw new Error('USUARIO_EXISTE');
      const u={id:'u'+(++db.seq),usuario:d.usuario,clave:d.clave,nombre:d.nombre,rol:d.rol,activo:true};BANCO.forEach(k=>u[k]=d[k]||null);db.users.push(u);save()},
    async actualizarUsuario(id,d){req(adm());if(id===uid&&(!d.activo||d.rol!=='admin'))throw new Error('AUTO');const u=db.users.find(x=>x.id===id);req(u);
      Object.assign(u,{nombre:d.nombre,rol:d.rol,activo:!!d.activo});BANCO.forEach(k=>u[k]=d[k]||null);save()},
    async cambiarClave(id,c){req(adm());if(String(c).length<6)throw new Error('CLAVE_CORTA');db.users.find(x=>x.id===id).clave=c;save()},
    async cambiarMiClave(c){yo().clave=c;save()},
    async misDatos(d){const u=yo();BANCO.forEach(k=>u[k]=d[k]||null);save()},
    async habilitaciones(){return cp(db.habs.filter(h=>adm()||h.tecnico_id===uid)).sort(ordFecha('fecha'))},
    async crearHabilitacion(d){req(adm());db.habs.push({...d,id:++db.seq,usada:false,creado_por:uid,created_at:new Date().toISOString()});save()},
    async eliminarHabilitacion(id){req(adm());const h=db.habs.find(x=>x.id===id);if(!h||h.usada)throw new Error('HAB_USADA');db.habs=db.habs.filter(x=>x.id!==id);save()}
  };
}

/* ====== estado ====== */
const api=DEMO?DemoAPI():(window.supabase?SupaAPI():null);
const S={me:null,cats:[],boletas:[],pagos:[],habs:[],users:[],tab:null,f:{tec:'',estado:'pendiente',mes:'',cat:''},mesTec:'',fb:null};
const ESTADOS={pendiente:'Por pagar',rechazada:'Rechazada',pagada:'Pagada'};
const badge=e=>`<span class="badge b-${esc(e)}">${esc(ESTADOS[e]||e)}</span>`;
const nombreDe=id=>{const u=S.users.find(x=>x.id===id);return u?(u.nombre||u.usuario):'—'};
const catDe=c=>S.cats.find(x=>x.codigo===c)?.nombre||c;
const pendientesDe=id=>S.boletas.filter(b=>b.tecnico_id===id&&b.estado==='pendiente');
const app=$('#app');

async function cargar(){
  const [cats,boletas,pagos,habs]=await Promise.all([api.categorias(),api.boletas(),api.pagos(),api.habilitaciones()]);
  Object.assign(S,{cats,boletas,pagos,habs});
  if(S.me.rol==='admin'){S.users=await api.usuarios();S.me=S.users.find(u=>u.id===S.me.id)||S.me}else S.users=[S.me];
}
async function refrescar(msg){try{await cargar()}catch(e){toast(msgErr(e),'err')}render();if(msg)toast(msg,'ok')}
function estadoDia(tec,fecha){return S.cats.filter(c=>c.activo).map(c=>{
  const bs=S.boletas.filter(b=>b.tecnico_id===tec&&b.fecha===fecha&&b.categoria===c.codigo&&b.estado!=='rechazada');
  const hs=S.habs.filter(h=>h.tecnico_id===tec&&h.fecha===fecha&&!h.usada&&(!h.categoria||h.categoria===c.codigo));
  return {c,bs,libre:!bs.length||hs.length>0,extra:bs.length>0&&hs.length>0}})}

/* ====== vistas comunes ====== */

/* ====== técnico ====== */
function vistaTec(){
  S.tab=S.tab||'nueva';const me=S.me,pend=pendientesDe(me.id),tot=sumar(pend,b=>b.monto_aprobado);
  const ult=S.pagos.find(p=>p.tecnico_id===me.id);const dia=estadoDia(me.id,hoy());
  const C={nueva:formBoleta,boletas:misBoletas,pagos:misPagos,datos:misDatos};
  return header()+`<section class="hero"><div class="saldo"><span>Por reembolsar</span><strong>${clp(tot)}</strong><small>${pend.length} boleta${pend.length===1?'':'s'} pendiente${pend.length===1?'':'s'}${ult?` · último pago ${clp(ult.monto)} el ${fFecha(ult.fecha_pago)}`:''}</small></div>
  <div class="hoy"><span class="h">Hoy, ${fFecha(hoy())}</span><ul>${dia.map(x=>`<li class="${x.bs.length&&!x.extra?'usado':''}"><b>${esc(x.c.nombre)}</b><span>${x.bs.length?(x.extra?'Boleta extra habilitada':'Rendido '+clp(sumar(x.bs,b=>b.monto_aprobado))):'Disponible · máx. '+clp(x.c.tope)}</span></li>`).join('')}</ul></div></section>`
  +tabs([['nueva','Nueva boleta'],['boletas','Mis boletas'],['pagos','Mis pagos'],['datos','Mis datos']])+`<main class="band">${(C[S.tab]||formBoleta)()}</main>`}
function catsHTML(){const f=S.fb;const dia=estadoDia(S.me.id,f.fecha);if(f.categoria&&!dia.some(x=>x.c.codigo===f.categoria&&x.libre))f.categoria='';
  return `<fieldset class="cats"><legend>¿Qué estás rindiendo?</legend>${dia.map(x=>`<label class="cat ${x.libre?'':'off'}"><input type="radio" name="categoria" value="${esc(x.c.codigo)}" ${f.categoria===x.c.codigo?'checked':''} ${x.libre?'':'disabled'} required><b>${esc(x.c.nombre)}</b><span>${x.libre?(x.extra?'Extra habilitada':'Máx. '+clp(x.c.tope)):'Ya rendido ese día'}</span></label>`).join('')}</fieldset>`}
function formBoleta(){const f=S.fb||(S.fb={fecha:hoy(),categoria:''});
  return `<form id="fBoleta" class="col form-boleta" autocomplete="off">${catsHTML()}
  <div class="row2"><label>Fecha de la boleta<input type="date" name="fecha" value="${esc(f.fecha)}" max="${hoy()}" required></label>
  <label>Monto total de la boleta ($)<input type="number" name="monto_boleta" inputmode="numeric" min="1" step="1" placeholder="Ej: 8500" required value="${esc(f.monto_boleta||'')}"></label></div>
  <p class="calc" id="calc" aria-live="polite"></p>
  <div class="row2"><label>Local o comercio<input name="comercio" maxlength="80" placeholder="Ej: Restaurante El Paso" value="${esc(f.comercio||'')}"></label>
  <label>N° de boleta <small class="muted">(opcional)</small><input name="numero_boleta" maxlength="30" inputmode="numeric" value="${esc(f.numero_boleta||'')}"></label></div>
  <label>Obra o cliente<input name="obra" maxlength="80" placeholder="¿En qué trabajo estabas?" value="${esc(f.obra||'')}"></label>
  <label>Foto de la boleta<input type="file" name="foto" accept="image/*,application/pdf" required></label><div id="prev" class="prev"></div>
  <label>Comentario <small class="muted">(opcional)</small><textarea name="observacion" rows="2" maxlength="300">${esc(f.observacion||'')}</textarea></label>
  <button class="btn big" id="btnEnviar">Enviar boleta</button></form>`}
function guardarFB(fm){['fecha','monto_boleta','comercio','numero_boleta','obra','observacion'].forEach(k=>S.fb[k]=fm[k].value);S.fb.categoria=fm.querySelector('[name=categoria]:checked')?.value||''}
function actualizarCalc(){const fm=$('#fBoleta'),el=$('#calc');if(!fm||!el)return;const m=Math.round(+fm.monto_boleta.value||0);const c=S.cats.find(x=>x.codigo===fm.querySelector('[name=categoria]:checked')?.value);
  if(!c||!m){el.textContent='';el.className='calc';return}const r=Math.min(m,c.tope);
  el.className='calc '+(m>c.tope?'warn':'ok');el.textContent=m>c.tope?`Se reembolsarán ${clp(r)}: la boleta supera el máximo de ${c.nombre} por ${clp(m-c.tope)}.`:`Se reembolsarán ${clp(r)}.`}
function preview(file){const p=$('#prev');if(!p)return;if(!file){p.innerHTML='';return}
  if(file.type.startsWith('image/')){const u=URL.createObjectURL(file);p.innerHTML=`<img src="${esc(u)}" alt="Vista previa de la boleta">`}else p.innerHTML=`<span class="muted">Adjunto: ${esc(file.name)}</span>`}
async function enviarBoleta(fm){
  const file=fm.foto.files[0];const cat=fm.querySelector('[name=categoria]:checked');
  if(!cat)return toast('Elige qué estás rindiendo.','err');if(!file)return toast('Adjunta la foto de la boleta.','err');
  const d={categoria:cat.value,fecha:fm.fecha.value,monto_boleta:Math.round(+fm.monto_boleta.value),comercio:fm.comercio.value.trim()||null,numero_boleta:fm.numero_boleta.value.trim()||null,obra:fm.obra.value.trim()||null,observacion:fm.observacion.value.trim()||null};
  if(!(d.monto_boleta>0))return toast('Ingresa el monto de la boleta.','err');
  if(d.numero_boleta&&S.boletas.some(b=>b.numero_boleta===d.numero_boleta&&(b.comercio||'').toLowerCase()===(d.comercio||'').toLowerCase()&&b.estado!=='rechazada')){
    if(!await confirmar('Ya rendiste una boleta con ese número en ese local. ¿Enviarla igual?','Enviar igual'))return}
  const btn=$('#btnEnviar');btn.disabled=true;btn.textContent='Enviando…';
  try{const b=await api.crearBoleta(d,file);S.fb={fecha:hoy(),categoria:''};await refrescar('Boleta enviada. Se te reembolsarán '+clp(b.monto_aprobado)+'.')}
  catch(e){toast(msgErr(e),'err');btn.disabled=false;btn.textContent='Enviar boleta'}}
function misBoletas(){const mes=S.mesTec;const todas=S.boletas.filter(b=>b.tecnico_id===S.me.id);const bs=todas.filter(b=>!mes||mesDe(b.fecha)===mes);
  const meses=[...new Set(todas.map(b=>mesDe(b.fecha)))].sort().reverse();
  return `<div class="bar"><label class="inl">Mes<select data-f="mesTec"><option value="">Todos</option>${meses.map(m=>opt(m,nomMes(m),mes)).join('')}</select></label><span class="muted">${bs.length} boleta${bs.length===1?'':'s'} · ${clp(sumar(bs.filter(b=>b.estado!=='rechazada'),b=>b.monto_aprobado))} rendido</span></div>
  ${bs.length?`<ul class="cards">${bs.map(b=>`<li class="card"><div class="c1"><b>${esc(catDe(b.categoria))}${b.extra?'<span class="tag">Extra</span>':''}</b><span class="muted">${fFecha(b.fecha)}${b.comercio?' · '+esc(b.comercio):''}${b.obra?' · '+esc(b.obra):''}</span></div>

function admResumen(){const tecs=S.users.filter(u=>u.rol==='tecnico');const pend=S.boletas.filter(b=>b.estado==='pendiente');const mes=hoy().slice(0,7);const pagMes=S.pagos.filter(p=>mesDe(p.fecha_pago)===mes);

  <div class="kpi"><span>Pagado en ${esc(nomMes(mes).split(' ')[0].toLowerCase())}</span><strong>${clp(sumar(pagMes,p=>p.monto))}</strong><small>${pagMes.length} transferencia${pagMes.length===1?'':'s'}</small></div>
  <div class="kpi"><span>Rendido este mes</span><strong>${clp(sumar(S.boletas.filter(b=>mesDe(b.fecha)===mes&&b.estado!=='rechazada'),b=>b.monto_aprobado))}</strong><small>con topes aplicados</small></div>

  <h2>Lo que se le debe a cada técnico</h2>

  <td><div class="acts-cell"><button class="btn ghost sm" data-act="verTec" data-id="${esc(x.u.id)}">Ver boletas</button><button class="btn sm" data-act="pagar" data-id="${esc(x.u.id)}" ${x.t>0?'':'disabled'}>Registrar pago</button></div></td></tr>`).join('')||`<tr><td colspan="5">${vacio('Aún no hay técnicos. Créalos en Usuarios.')}</td></tr>`}</tbody></table>`}
function filtrarBoletas(){const f=S.f;return S.boletas.filter(b=>(!f.tec||b.tecnico_id===f.tec)&&(!f.estado||b.estado===f.estado)&&(!f.mes||mesDe(b.fecha)===f.mes)&&(!f.cat||b.categoria===f.cat))}

  <table class="t stack"><thead><tr><th>Fecha</th><th>Técnico</th><th>Ítem</th><th>Local / obra</th><th class="r">Boleta</th><th class="r">Reembolso</th><th>Estado</th><th></th></tr></thead><tbody>${bs.map(b=>`<tr><td class="nw">${fFecha(b.fecha)}</td><td>${esc(nombreDe(b.tecnico_id))}</td><td>${esc(catDe(b.categoria))}${b.extra?'<span class="tag">Extra</span>':''}</td>
  <td>${esc(b.comercio||'—')}${b.obra?`<br><small class="muted">${esc(b.obra)}</small>`:''}</td><td class="r num">${clp(b.monto_boleta)}</td><td class="r num"><b>${clp(b.monto_aprobado)}</b>${b.monto_boleta>b.monto_aprobado&&b.estado!=='rechazada'?'<br><small class="muted">tope aplicado</small>':''}</td><td>${badge(b.estado)}</td>
  <td><div class="acts-cell"><button class="btn ghost sm" data-act="verB" data-id="${esc(b.id)}">Foto</button>${b.estado!=='pagada'?`<button class="btn ghost sm" data-act="ajustar" data-id="${esc(b.id)}">Revisar</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="8">${vacio('No hay boletas con estos filtros.')}</td></tr>`}</tbody></table>`}
function admPagos(){const ps=S.pagos.filter(p=>!S.f.tec||p.tecnico_id===S.f.tec);
  return `<div class="filters">${selTec()}<button class="btn ghost sm" data-act="csvP">Exportar a Excel (CSV)</button></div><p class="muted">${ps.length} pago${ps.length===1?'':'s'} · ${clp(sumar(ps,p=>p.monto))}</p>
  <table class="t stack"><thead><tr><th>Fecha</th><th>Técnico</th><th class="r">Monto</th><th class="r">Boletas</th><th>Nota</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td class="nw">${fFecha(p.fecha_pago)}</td><td>${esc(nombreDe(p.tecnico_id))}</td><td class="r num"><b>${clp(p.monto)}</b></td><td class="r">${S.boletas.filter(b=>b.pago_id===p.id).length}</td><td>${esc(p.nota||'')}</td>
  <td><div class="acts-cell"><button class="btn ghost sm" data-act="verP" data-id="${esc(p.id)}">Comprobante</button><button class="btn ghost sm" data-act="detP" data-id="${esc(p.id)}">Detalle</button></div></td></tr>`).join('')||`<tr><td colspan="6">${vacio('Sin pagos registrados.')}</td></tr>`}</tbody></table>`}
function admUsuarios(){return `<div class="bar"><button class="btn" data-act="nuevoU">Nuevo usuario</button><span class="muted">Desactivar bloquea el ingreso pero conserva su historial de boletas y pagos.</span></div>
  <table class="t stack"><thead><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th class="r">Por pagar</th><th></th></tr></thead><tbody>${S.users.map(u=>`<tr class="${u.activo?'':'dim'}"><td><code>${esc(u.usuario)}</code></td><td>${esc(u.nombre)}</td><td>${u.rol==='admin'?'Administrador':'Técnico'}</td><td>${u.activo?'<span class="badge b-pagada">Activo</span>':'<span class="badge b-rechazada">Desactivado</span>'}</td><td class="r num">${clp(sumar(pendientesDe(u.id),b=>b.monto_aprobado))}</td>
  <td><div class="acts-cell"><button class="btn ghost sm" data-act="editU" data-id="${esc(u.id)}">Editar</button><button class="btn ghost sm" data-act="claveU" data-id="${esc(u.id)}">Clave</button>${u.id!==S.me.id?`<button class="btn ghost sm ${u.activo?'danger':''}" data-act="togU" data-id="${esc(u.id)}">${u.activo?'Desactivar':'Activar'}</button>`:''}</div></td></tr>`).join('')}</tbody></table>`}
function admHabs(){const tecs=S.users.filter(u=>u.activo&&u.rol==='tecnico');
  return `<div class="split"><form id="fHab" class="col box"><h3>Habilitar una boleta extra</h3><p class="muted" style="margin:0">Para casos especiales: el técnico podrá subir una boleta más de ese ítem en ese día, aunque ya haya rendido una.</p>

  <div class="row2"><label>Fecha<input type="date" name="fecha" value="${hoy()}" required></label><label>Ítem<select name="cat"><option value="">Cualquier ítem</option>${S.cats.map(c=>opt(c.codigo,c.nombre,'')).join('')}</select></label></div>
  <label>Motivo<input name="motivo" maxlength="150" placeholder="Ej: turno doble en obra"></label><button class="btn">Habilitar</button></form>

/* ====== modales ====== */
async function verArchivo(bucket,path,titulo){if(!path)return toast('Sin archivo adjunto.','err');
  try{const url=await api.url(bucket,path);const pdf=/\.pdf$/i.test(path)||String(url).startsWith('data:application/pdf');
    abrirModal(`<h3>${esc(titulo)}</h3>${pdf?`<p><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir PDF</a></p>`:`<img class="visor" src="${esc(url)}" alt="${esc(titulo)}"><p><a href="${esc(url)}" target="_blank" rel="noopener">Abrir en tamaño completo</a></p>`}<div class="acts"><button class="btn ghost" data-x>Cerrar</button></div>`);
    $('#modalBody').onclick=e=>{if(e.target.closest('[data-x]'))cerrarModal()}}catch(e){toast(msgErr(e),'err')}}
function modalAjustar(b){abrirModal(`<h3>Revisar boleta</h3><p class="muted">${esc(nombreDe(b.tecnico_id))} · ${esc(catDe(b.categoria))} · ${fFecha(b.fecha)} · boleta ${clp(b.monto_boleta)} · tope ${clp(b.tope_aplicado)}</p>
  <form class="col"><label>Monto a reembolsar ($)<input type="number" name="monto" min="0" step="1" value="${esc(b.monto_aprobado)}" required></label>
  <label>Estado<select name="estado">${opt('pendiente','Por pagar',b.estado)}${opt('rechazada','Rechazada (no se paga)',b.estado)}</select></label>
  <label>Nota para el técnico<input name="motivo" maxlength="200" value="${esc(b.motivo_admin||'')}" placeholder="Ej: boleta ilegible, sube otra"></label>
  <div class="acts"><button type="button" class="btn ghost danger" data-a="del">Eliminar</button><span class="sp"></span><button type="button" class="btn ghost" data-a="x">Cancelar</button><button class="btn">Guardar</button></div></form>`);
  const mb=$('#modalBody');
  mb.onclick=async e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='x')cerrarModal();if(a==='del'){if(await confirmar('¿Eliminar esta boleta? No se puede deshacer.','Eliminar'))try{await api.eliminarBoleta(b);await refrescar('Boleta eliminada.')}catch(er){toast(msgErr(er),'err')}}};
  mb.onsubmit=async e=>{e.preventDefault();const fm=e.target;try{await api.ajustarBoleta(b.id,{monto_aprobado:Math.max(0,Math.round(+fm.monto.value||0)),estado:fm.estado.value,motivo_admin:fm.motivo.value.trim()||null});cerrarModal();await refrescar('Boleta actualizada.')}catch(er){toast(msgErr(er),'err')}}}
function modalPago(tecId){const u=S.users.find(x=>x.id===tecId);if(!u)return;const bs=pendientesDe(tecId).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const datos=[u.nombre,u.rut,u.banco,u.tipo_cuenta,u.numero_cuenta?'N° '+u.numero_cuenta:'',u.email_pago].filter(Boolean);
  abrirModal(`<h3>Registrar pago a ${esc(u.nombre||u.usuario)}</h3>
  <div class="banco">${u.banco||u.numero_cuenta?`<div>${datos.map(esc).join('<br>')}</div><button type="button" class="btn ghost sm" data-a="copiar">Copiar datos</button>`:'<span class="muted">Este técnico aún no carga sus datos bancarios (puede hacerlo en Mis datos, o tú en Usuarios).</span>'}</div>
  <form class="col"><div class="checks"><label class="chk all"><input type="checkbox" data-all checked> Todas las pendientes (${bs.length})</label>${bs.map(b=>`<label class="chk"><input type="checkbox" name="b" value="${esc(b.id)}" checked><span>${fFecha(b.fecha)} · ${esc(catDe(b.categoria))}${b.comercio?' · '+esc(b.comercio):''}</span><span class="num">${clp(b.monto_aprobado)}</span></label>`).join('')}</div>
  <p class="total">Total a transferir <strong id="totPago"></strong></p>
  <div class="row2"><label>Fecha de la transferencia<input type="date" name="fecha" value="${hoy()}" max="${hoy()}" required></label><label>Comprobante (foto o PDF)<input type="file" name="comp" accept="image/*,application/pdf" required></label></div>
  <label>Nota <small class="muted">(opcional)</small><input name="nota" maxlength="200" placeholder="Ej: transferencia desde cuenta empresa"></label>
  <div class="acts"><button type="button" class="btn ghost" data-a="x">Cancelar</button><button class="btn" id="btnPago">Registrar pago</button></div></form>`);
  const mb=$('#modalBody'),fm=mb.querySelector('form');
  const ids=()=>$$('[name=b]:checked',fm).map(i=>bs.find(b=>String(b.id)===i.value).id);
  const tot=()=>{const s=ids();$('#totPago').textContent=clp(sumar(bs.filter(b=>s.includes(b.id)),b=>b.monto_aprobado));return s};tot();
  fm.onchange=e=>{if(e.target.matches('[data-all]'))$$('[name=b]',fm).forEach(i=>i.checked=e.target.checked);tot()};
  mb.onclick=async e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='x')cerrarModal();if(a==='copiar'){try{await navigator.clipboard.writeText(datos.join('\n'));toast('Datos bancarios copiados.','ok')}catch(er){toast('No se pudo copiar.','err')}}};
  mb.onsubmit=async e=>{e.preventDefault();const s=tot(),file=fm.comp.files[0];if(!s.length)return toast('Marca al menos una boleta.','err');if(!file)return toast('Adjunta el comprobante de la transferencia.','err');
    const btn=$('#btnPago');btn.disabled=true;btn.textContent='Registrando…';
    try{await api.registrarPago(tecId,s,fm.fecha.value,fm.nota.value.trim(),file);cerrarModal();await refrescar(`Pago registrado. ${u.nombre||u.usuario} queda con su saldo al día.`)}catch(er){toast(msgErr(er),'err');btn.disabled=false;btn.textContent='Registrar pago'}}}
function modalDetPago(id){const p=S.pagos.find(x=>String(x.id)===id);if(!p)return;const bs=S.boletas.filter(b=>b.pago_id===p.id);
  abrirModal(`<h3>Pago del ${fFecha(p.fecha_pago)} · ${esc(nombreDe(p.tecnico_id))}</h3><p class="total">Monto <strong>${clp(p.monto)}</strong></p>${p.nota?`<p class="muted">${esc(p.nota)}</p>`:''}
  <ul class="mini">${bs.map(b=>`<li><span>${fFecha(b.fecha)} · ${esc(catDe(b.categoria))}${b.comercio?' · '+esc(b.comercio):''}</span><span class="num">${clp(b.monto_aprobado)}</span></li>`).join('')}</ul>
  <div class="acts"><button class="btn ghost" data-a="comp">Ver comprobante</button><button class="btn" data-a="x">Cerrar</button></div>`);
  $('#modalBody').onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a==='x')cerrarModal();if(a==='comp')verArchivo('comprobantes',p.comprobante_path,`Comprobante · ${fFecha(p.fecha_pago)} · ${clp(p.monto)}`)}}
function modalUsuario(u){const nuevo=!u;u=u||{rol:'tecnico',activo:true};
  abrirModal(`<h3>${nuevo?'Nuevo usuario':'Editar a '+esc(u.nombre||u.usuario)}</h3><form class="col">
  ${nuevo?`<div class="row2"><label>Usuario<input name="usuario" required maxlength="40" placeholder="El que quieras, ej: Juan Pérez" autocapitalize="none" spellcheck="false"></label><label>Clave inicial<input name="clave" required minlength="6" autocomplete="new-password"></label></div>`:`<p class="muted" style="margin:0">Usuario: <code>${esc(u.usuario)}</code></p>`}
  <div class="row2"><label>Nombre completo<input name="nombre" required maxlength="80" value="${esc(u.nombre||'')}"></label><label>Rol<select name="rol" ${u.id===S.me.id?'disabled':''}>${opt('tecnico','Técnico',u.rol)}${opt('admin','Administrador',u.rol)}</select></label></div>
  ${camposBanco(u)}<div class="acts"><button type="button" class="btn ghost" data-a="x">Cancelar</button><button class="btn">${nuevo?'Crear usuario':'Guardar cambios'}</button></div></form>`);
  const mb=$('#modalBody');mb.onclick=e=>{if(e.target.closest('[data-a=x]'))cerrarModal()};
  mb.onsubmit=async e=>{e.preventDefault();const fm=e.target,btn=fm.querySelector('button:not([type])');const d=leerBanco(fm);d.nombre=fm.nombre.value.trim();d.rol=fm.rol.disabled?u.rol:fm.rol.value;btn.disabled=true;
    try{if(nuevo){d.usuario=normU(fm.usuario.value);if(!d.usuario)throw new Error('Escribe un nombre de usuario.');d.clave=fm.clave.value;if(d.clave.length<6)throw new Error('CLAVE_CORTA');await api.crearUsuario(d);cerrarModal();await refrescar(`Usuario ${d.usuario} creado. Entrégale su usuario y clave.`)}
    else{d.activo=u.activo;await api.actualizarUsuario(u.id,d);cerrarModal();await refrescar('Usuario actualizado.')}}catch(er){btn.disabled=false;toast(msgErr(er),'err')}}}
function modalClave(u){abrirModal(`<h3>Nueva clave para ${esc(u.nombre||u.usuario)}</h3><form class="col"><label>Clave nueva<input name="c" minlength="6" required autocomplete="new-password"></label><p class="muted" style="margin:0">Entrégasela al usuario; podrá cambiarla en Mis datos.</p><div class="acts"><button type="button" class="btn ghost" data-a="x">Cancelar</button><button class="btn">Guardar clave</button></div></form>`);
  const mb=$('#modalBody');mb.onclick=e=>{if(e.target.closest('[data-a=x]'))cerrarModal()};
  mb.onsubmit=async e=>{e.preventDefault();const c=e.target.c.value;try{if(c.length<6)throw new Error('CLAVE_CORTA');if(u.id===S.me.id)await api.cambiarMiClave(c);else await api.cambiarClave(u.id,c);cerrarModal();toast('Clave actualizada.','ok')}catch(er){toast(msgErr(er),'err')}}}

/* ====== exportar ====== */
function descargarCSV(nombre,filas){const csv='﻿'+filas.map(r=>r.map(v=>{const s=String(v??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){toast('El navegador bloqueó la descarga.','err')}}
function csvBoletas(){descargarCSV(`boletas_${hoy()}.csv`,[['Fecha','Técnico','Ítem','Local','N° boleta','Obra','Monto boleta','Tope','Reembolso','Estado','Extra','Nota admin'],...filtrarBoletas().map(b=>[fFecha(b.fecha),nombreDe(b.tecnico_id),catDe(b.categoria),b.comercio,b.numero_boleta,b.obra,b.monto_boleta,b.tope_aplicado,b.monto_aprobado,ESTADOS[b.estado],b.extra?'Sí':'',b.motivo_admin])])}
function csvPagos(){descargarCSV(`pagos_${hoy()}.csv`,[['Fecha pago','Técnico','Monto','N° boletas','Nota'],...S.pagos.filter(p=>!S.f.tec||p.tecnico_id===S.f.tec).map(p=>[fFecha(p.fecha_pago),nombreDe(p.tecnico_id),p.monto,S.boletas.filter(b=>b.pago_id===p.id).length,p.nota])])}

/* ====== render y eventos ====== */
function render(){
  if(!api){app.innerHTML=`<main class="band"><h1>No se pudo cargar</h1><p>Falta la librería de conexión. Revisa tu internet y recarga la página.</p></main>`;return}
  app.innerHTML=!S.me?vistaLogin():S.me.rol==='admin'?vistaAdm():vistaTec();
  if(S.me&&S.me.rol!=='admin'&&S.tab==='nueva')actualizarCalc()}
async function login(fm){const btn=fm.querySelector('button');btn.disabled=true;btn.textContent='Ingresando…';
  try{S.me=await api.login(fm.u.value,fm.c.value);S.tab=null;S.fb=null;await cargar();render()}catch(e){toast(msgErr(e),'err');btn.disabled=false;btn.textContent='Ingresar'}}

app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;render();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const id=b.dataset.id;
  const bol=()=>S.boletas.find(x=>String(x.id)===id);
  switch(b.dataset.act){
    case 'salir':await api.logout();Object.assign(S,{me:null,tab:null,fb:null,users:[],boletas:[],pagos:[],habs:[]});render();break;
    case 'recargar':refrescar('Datos actualizados.');break;
    case 'verB':{const x=bol();if(x)verArchivo('boletas',x.foto_path,`Boleta · ${catDe(x.categoria)} · ${fFecha(x.fecha)}`);break}
    case 'verP':{const p=S.pagos.find(x=>String(x.id)===id);if(p)verArchivo('comprobantes',p.comprobante_path,`Comprobante · ${fFecha(p.fecha_pago)} · ${clp(p.monto)}`);break}
    case 'delB':{const x=bol();if(x&&await confirmar('¿Eliminar esta boleta? Podrás subirla de nuevo.','Eliminar'))try{await api.eliminarBoleta(x);await refrescar('Boleta eliminada.')}catch(er){toast(msgErr(er),'err')}break}
    case 'ajustar':{const x=bol();if(x)modalAjustar(x);break}
    case 'pagar':modalPago(id);break;
    case 'verTec':S.f={...S.f,tec:id,estado:'pendiente',mes:''};S.tab='boletas';render();break;
    case 'detP':modalDetPago(id);break;
    case 'nuevoU':modalUsuario(null);break;
    case 'editU':modalUsuario(S.users.find(u=>u.id===id));break;
    case 'claveU':modalClave(S.users.find(u=>u.id===id));break;
    case 'togU':{const u=S.users.find(x=>x.id===id);if(!u)break;const n=u.nombre||u.usuario;
      if(await confirmar(u.activo?`¿Desactivar a ${n}? No podrá ingresar; su historial se mantiene.`:`¿Reactivar a ${n}?`,u.activo?'Desactivar':'Activar'))
        try{await api.actualizarUsuario(u.id,{...u,activo:!u.activo});await refrescar(u.activo?'Usuario desactivado.':'Usuario activado.')}catch(er){toast(msgErr(er),'err')}break}
    case 'delH':{const h=S.habs.find(x=>String(x.id)===id);if(h&&await confirmar('¿Quitar esta habilitación?','Quitar'))try{await api.eliminarHabilitacion(h.id);await refrescar('Habilitación quitada.')}catch(er){toast(msgErr(er),'err')}break}
    case 'csvB':csvBoletas();break;
    case 'csvP':csvPagos();break;
  }});
app.addEventListener('change',e=>{
  const s=e.target.closest('[data-f]');if(s){if(s.dataset.f==='mesTec')S.mesTec=s.value;else S.f[s.dataset.f]=s.value;render();return}
  const fm=e.target.closest('#fBoleta');if(!fm)return;
  if(e.target.name==='fecha'){guardarFB(fm);fm.querySelector('.cats').outerHTML=catsHTML();actualizarCalc()}
  else if(e.target.name==='foto')preview(e.target.files[0]);
  else{guardarFB(fm);actualizarCalc()}});
app.addEventListener('input',e=>{const fm=e.target.closest('#fBoleta');if(fm&&e.target.type!=='file'){guardarFB(fm);actualizarCalc()}});
app.addEventListener('submit',async e=>{e.preventDefault();const fm=e.target;
  switch(fm.id){
    case 'fLogin':login(fm);break;
    case 'fBoleta':enviarBoleta(fm);break;
    case 'fDatos':try{const d=leerBanco(fm);await api.misDatos(d);Object.assign(S.me,d);toast('Datos guardados.','ok')}catch(er){toast(msgErr(er),'err')}break;
    case 'fClave':{const c=fm.c1.value;if(c.length<6)return toast(ERR.CLAVE_CORTA,'err');if(c!==fm.c2.value)return toast('Las claves no coinciden.','err');
      try{await api.cambiarMiClave(c);fm.reset();toast('Clave actualizada.','ok')}catch(er){toast(msgErr(er),'err')}break}
    case 'fHab':{if(!fm.tec.value)return toast('Elige un técnico.','err');
      try{await api.crearHabilitacion({tecnico_id:fm.tec.value,fecha:fm.fecha.value,categoria:fm.cat.value||null,motivo:fm.motivo.value.trim()||null});await refrescar('Habilitación creada.')}catch(er){toast(msgErr(er),'err')}break}
    case 'fTopes':try{for(const c of S.cats){const t=Math.max(0,Math.round(+fm['t_'+c.codigo].value||0)),a=fm['a_'+c.codigo].checked;if(t!==c.tope||a!==c.activo)await api.guardarCategoria(c.codigo,{tope:t,activo:a})}await refrescar('Topes guardados.')}catch(er){toast(msgErr(er),'err')}break;
  }});

(async()=>{try{if(api){S.me=await api.sesion();if(S.me)await cargar()}}catch(e){console.error(e);S.me=null}render()})();
}
</script>
